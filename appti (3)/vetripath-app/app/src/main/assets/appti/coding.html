<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0f172a">
    <link rel="canonical" href="https://vetripathlearn.site/coding.html">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="images/logo.png">
    <link rel="icon" type="image/png" sizes="192x192" href="images/logo.png">
    <link rel="icon" type="image/png" sizes="512x512" href="images/logo.png">

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://vetripathlearn.site/coding.html">
    <meta property="og:title" content="Coding Practice Workstation — Data Structures & Algorithms | VetriPathLearn">
    <meta property="og:description" content="Practice coding problems, data structures, and algorithms for technical interview rounds at TCS, Infosys, Wipro, and Accenture with an interactive code execution sandbox.">
    <meta property="og:image" content="https://vetripathlearn.site/images/logo.png">
    <meta property="og:site_name" content="VetriPathLearn">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Course",
      "name": "Coding & DSA Preparation Workstation",
      "description": "Interactive coding workspace covering arrays, strings, dynamic programming, trees, graphs, and company interview coding challenges.",
      "provider": {
        "@type": "Organization",
        "name": "VetriPathLearn",
        "url": "https://vetripathlearn.site/"
      },
      "url": "https://vetripathlearn.site/coding.html"
    }
    </script>
    <style>
        .coding-container {
            display: grid;
            grid-template-columns: 1.1fr 1.3fr;
            gap: 1.5rem;
            height: calc(100vh - 120px);
            min-height: 550px;
            margin-top: 1rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 992px) {
            .coding-container {
                grid-template-columns: 1fr;
                height: auto;
                min-height: unset;
            }
            .left-panel, .right-panel {
                max-height: none !important;
                overflow-y: visible !important;
            }
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            max-height: 100%;
            padding-right: 0.3rem;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            max-height: 100%;
        }

        /* Config glass panel styling */
        .selector-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .description-card {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            border-radius: var(--border-radius-md);
            background: var(--surface);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .description-card h3 {
            margin-top: 0;
            font-size: 1.3rem;
            color: var(--primary);
            font-family: var(--font-heading);
        }

        .description-card h4 {
            margin-top: 1.2rem;
            margin-bottom: 0.4rem;
            font-size: 1.05rem;
            color: var(--text-primary);
        }

        .description-card code {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.1rem 0.3rem;
            border-radius: 4px;
            color: var(--secondary);
        }

        .description-card p {
            margin-bottom: 0.8rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Editor visual board */
        .editor-card {
            display: flex;
            flex-direction: column;
            flex: 1;
            background: rgba(18, 18, 24, 0.65);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: var(--border-radius-md);
            overflow: hidden;
            min-height: 380px;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(25, 25, 35, 0.95);
            border-bottom: 1px solid var(--glass-border);
            padding: 0.6rem 1rem;
        }

        .lang-tabs {
            display: flex;
            gap: 0.5rem;
        }

        .lang-tab {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.4rem 1rem;
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-tab:hover {
            color: var(--text-primary);
        }

        .lang-tab.active {
            background: var(--primary);
            color: #fff;
        }

        .editor-body {
            display: flex;
            flex: 1;
            position: relative;
            font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.5;
            background: rgba(10, 10, 15, 0.7);
        }

        .line-numbers {
            width: 42px;
            background: rgba(15, 15, 22, 0.9);
            border: none;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            text-align: right;
            padding: 1rem 0.5rem 1rem 0;
            resize: none;
            overflow-y: hidden;
            pointer-events: none;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
            user-select: none;
            outline: none;
        }

        .editor-textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #f8f8f2;
            padding: 1rem;
            resize: none;
            outline: none;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
            overflow-y: auto;
            white-space: pre;
            overflow-x: auto;
        }

        .editor-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(25, 25, 35, 0.95);
            border-top: 1px solid var(--glass-border);
            padding: 0.7rem 1rem;
        }

        /* Results / Run stats section */
        .run-status-panel {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-md);
            padding: 1.2rem;
            overflow-y: auto;
            max-height: 250px;
        }

        .testcase-item {
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 0.6rem;
            border-left: 4px solid var(--text-muted);
            background: rgba(255, 255, 255, 0.02);
        }

        .testcase-item.passed {
            border-left-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }

        .testcase-item.failed {
            border-left-color: var(--danger);
            background: rgba(239, 68, 68, 0.05);
        }

        .testcase-badge {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-pass {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .badge-fail {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .diff-badge {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-left: 0.8rem;
        }

        .diff-beginner { background: rgba(6, 182, 212, 0.15); color: var(--info); }
        .diff-easy { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .diff-medium { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .diff-hard { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    </style>
</head>
<body>

    <!-- Global Loader -->
    <div id="global-loader" class="loading-screen">
        <div class="loader-content">
            <div class="loader-logo-img-wrapper"><img src="images/logo.png" alt="VetriPathLearn Logo" class="loader-logo-img"></div>
            <div class="loader-logo">VetriPathLearn</div>
            <div class="loader-quote">
                <p class="quote-text">"Walk the Path. Become the Victory. Inspire the World"</p>
            </div>
            <div class="loader-spinner"></div>
        </div>
    </div>

    <!-- Nav Placement -->
    <div id="nav-placeholder"></div>

    <main class="container fade-in-up">
        
        <div class="coding-container">
            
            <!-- LEFT PANEL: Question Config & description -->
            <div class="left-panel">
                
                <!-- Topic Selection Header -->
                <div class="glass-card" style="padding:1.2rem; display: flex; flex-direction: column; gap: 0.8rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;">
                            <i class="fa-solid fa-code" style="color: var(--primary); margin-right: 0.3rem;"></i> Challenges
                        </div>
                        <div id="solved-progress-lbl" style="font-size: 0.85rem; font-weight: 700; color: var(--success);">
                            Solved: 0 / 0
                        </div>
                    </div>
                    <!-- Search input -->
                    <div style="position: relative; width: 100%;">
                        <input id="search-challenge" type="text" placeholder="Search 200+ challenges..." 
                               style="width: 100%; padding: 0.5rem 1rem 0.5rem 2.2rem; font-size: 0.9rem; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.1); color: var(--text-primary); outline: none;">
                        <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem;"></i>
                    </div>
                    <div class="selector-row">
                        <div class="form-group" style="margin:0;">
                            <label class="form-label" for="select-category" style="font-size:0.85rem;">Coding Topic</label>
                            <select class="form-control" id="select-category" style="padding:0.4rem; font-size:0.9rem; margin-top:0.3rem; width:100%;">
                                <!-- Filled by JS -->
                            </select>
                        </div>
                        <div class="form-group" style="margin:0;">
                            <label class="form-label" for="select-question" style="font-size:0.85rem;">Challenge</label>
                            <select class="form-control" id="select-question" style="padding:0.4rem; font-size:0.9rem; margin-top:0.3rem; width:100%;">
                                <!-- Filled by JS -->
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Problem Description Viewer -->
                <div class="description-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap: wrap; gap: 0.5rem;">
                        <div style="display:flex; align-items:center;">
                            <h2 id="question-title" style="font-size:1.5rem; margin:0; font-family:var(--font-heading);">Problem Title</h2>
                            <span id="question-diff-badge" class="diff-badge">EASY</span>
                        </div>
                        <button class="btn btn-secondary" id="btn-toggle-hint" onclick="toggleHint()" style="padding: 0.45rem 0.9rem; font-size: 0.8rem; border-radius: 8px; display: flex; align-items: center; gap: 0.35rem; border: 1px solid var(--glass-border);">
                            <i class="fa-solid fa-lightbulb" style="color: var(--warning);"></i> <span>Concept & Hint</span>
                        </button>
                    </div>
                    <!-- Hint panel (hidden by default) -->
                    <div id="hint-panel" style="display: none; background: rgba(245, 158, 11, 0.05); border: 1px dashed var(--warning); border-radius: 10px; padding: 1.2rem; margin-bottom: 1.2rem;">
                        <h4 style="margin-top: 0; color: var(--warning); display: flex; align-items: center; gap: 0.4rem; font-size: 1rem;">
                            <i class="fa-solid fa-graduation-cap"></i> Conceptual Guide & Hint
                        </h4>
                        <div id="hint-body" style="font-size: 0.9rem; color: var(--text-secondary); line-height: 1.5; white-space: pre-line;">
                            <!-- Filled dynamically -->
                        </div>
                    </div>
                    <div id="question-body">
                        <!-- Loaded dynamically -->
                    </div>
                </div>

                <!-- Run status Output panel -->
                <div class="run-status-panel" id="run-status-panel" style="display:none;">
                    <h3 id="run-status-title" style="font-size:1.15rem; margin-top:0; margin-bottom:0.3rem;">All Test Cases Passed!</h3>
                    <p id="run-status-desc" style="color:var(--text-secondary); font-size:0.85rem; margin-top:0; margin-bottom:1rem;">Review test outcomes below.</p>
                    <div id="testcase-list">
                        <!-- Loaded dynamically -->
                    </div>
                </div>

            </div>

            <!-- RIGHT PANEL: Editor & execution console -->
            <div class="right-panel">
                
                <!-- Code Editor Glass Card -->
                <div class="editor-card">
                    
                    <!-- Language Selection Header -->
                    <div class="editor-header">
                        <div class="lang-tabs">
                            <button class="lang-tab" data-lang="python" onclick="setLanguage('python')">Python</button>
                            <button class="lang-tab" data-lang="c" onclick="setLanguage('c')">C</button>
                            <button class="lang-tab" data-lang="cpp" onclick="setLanguage('cpp')">C++</button>
                            <button class="lang-tab" data-lang="java" onclick="setLanguage('java')">Java</button>
                        </div>
                        <div style="display:flex; align-items:center; gap:0.8rem;">
                            <button id="btn-anti-cheat-toggle" onclick="toggleCodingAntiCheat()" class="btn btn-secondary" style="padding:0.35rem 0.8rem; font-size:0.78rem; border-radius:20px; border:1px solid rgba(255,255,255,0.15);">
                                <i class="fa-solid fa-shield-halved" style="color:var(--text-muted);"></i> Proctored Mode
                            </button>
                            <div style="color:var(--text-muted); font-size:0.8rem; font-weight:600;">
                                <i class="fa-solid fa-code"></i> Workspace Editor
                            </div>
                        </div>
                    </div>

                    <!-- Editor Textarea Area -->
                    <div class="editor-body">
                        <textarea id="line-numbers" class="line-numbers" readonly>1</textarea>
                        <textarea id="code-editor" class="editor-textarea" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Write your code here..."></textarea>
                    </div>

                    <!-- Editor Footer Control Area -->
                    <div class="editor-footer">
                        <button class="btn btn-secondary" onclick="resetCode()" style="padding:0.5rem 1rem; font-size:0.85rem; border-radius:8px;">
                            <i class="fa-solid fa-rotate-left"></i> Reset
                        </button>
                        <button class="btn btn-primary" onclick="executeCode()" style="padding:0.5rem 1.8rem; font-size:0.9rem; border-radius:8px;">
                            <i class="fa-solid fa-play"></i> Run Tests
                        </button>
                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- Footer Placement -->
    <div id="footer-placeholder"></div>

    <!-- Script imports -->
    <script src="js/storage.js"></script>
    <script src="js/cheating_protection.js"></script>
    <script src="js/coding_data.js"></script>
    <script src="js/coding_runner.js"></script>
    <script src="js/coding.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
