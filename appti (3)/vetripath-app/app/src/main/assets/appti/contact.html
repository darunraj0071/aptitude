    <meta property="og:description" content="Get in touch with the VetriPathLearn developer team for questions, feedback, or suggestions about campus placement preparation.">

    <link rel="stylesheet" href="css/animations.css">

    <!-- JSON-LD Structured Data -->

      "@context": "https://schema.org",
      "@type": "ContactPage",
      "name": "Contact Us - VetriPathLearn",
      "url": "https://vetripathlearn.site/contact.html",
      "description": "Contact VetriPathLearn support and development team for feedback and questions.",
      "mainEntity": {
        "@type": "Organization",
        "name": "VetriPathLearn",
        "url": "https://vetripathlearn.site/",
        "sameAs": [
          "https://www.linkedin.com/in/darun-raj-b05151293/",
          "https://github.com/darunraj0071",
          "https://darun-portfolio.netlify.app/"
        ]
      }

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7971777206323143" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Global Loader -->
    <div id="global-loader" class="loading-screen">
        <div class="loader-content">
            <div class="loader-logo-img-wrapper"><img src="images/logo.png" alt="VetriPathLearn Logo" class="loader-logo-img"></div>
            <div class="loader-logo">VetriPathLearn</div>
            <div class="loader-quote">
                <p class="quote-text">"Walk the Path. Become the Victory. Inspire the World"</p>
            </div>
            <div class="loader-spinner"></div>
        </div>
    </div>

    <!-- Nav Placeholder -->
    <div id="nav-placeholder"></div>

    <main class="container fade-in-up" style="max-width: 700px; padding-top: 3rem; padding-bottom: 5rem;">
        
        <div class="glass-card" style="padding: 2.5rem; border-radius: var(--border-radius-lg);">
            <h1 style="font-size: 2.2rem; margin-bottom: 0.5rem; font-family: var(--font-heading); text-align: center;">Get in Touch</h1>
            <p style="color: var(--text-secondary); text-align: center; margin-bottom: 2.5rem; font-size: 0.95rem;">
                Have feedback about our placement preparation questions? Encountered a mistake? Send us a message below.
            </p>

            <form id="contact-form" onsubmit="handleContactSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="contact-name">Full Name</label>
                    <input class="form-control" type="text" id="contact-name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="contact-email">Email Address</label>
                    <input class="form-control" type="email" id="contact-email" placeholder="example@domain.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="contact-subject">Topic / Subject</label>
                    <select class="form-control" id="contact-subject" required>
                        <option value="" disabled selected>Select feedback topic</option>
                        <option value="content">Question Content Mistake</option>
                        <option value="feature">New Feature Recommendation</option>
                        <option value="bug">Technical Issue / Bug Report</option>
                        <option value="partnership">Business / Institutional Partnership</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="contact-message">Detailed Feedback</label>
                    <textarea class="form-control" id="contact-message" rows="5" placeholder="Write your message here..." required style="resize: vertical; font-family: inherit;"></textarea>
                </div>

                <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 1rem; padding: 0.9rem;">
                    <i class="fa-solid fa-paper-plane"></i> Send Feedback Message
                </button>
            </form>
        </div>

        <!-- Developer Profiles Section -->
        <div class="glass-card" style="padding: 2rem; border-radius: var(--border-radius-lg); margin-top: 2rem; text-align: center;">
            <h2 style="font-size: 1.3rem; margin-bottom: 1.2rem; font-family: var(--font-heading);">Connect with the Developer</h2>
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="https://www.linkedin.com/in/darun-raj-b05151293/" target="_blank" rel="noopener noreferrer" class="btn btn-outline" aria-label="LinkedIn Profile" style="display: inline-flex; align-items: center; gap: 0.5rem;">
                    <i class="fa-brands fa-linkedin"></i> LinkedIn
                </a>
                <a href="https://github.com/darunraj0071" target="_blank" rel="noopener noreferrer" class="btn btn-outline" aria-label="GitHub Profile" style="display: inline-flex; align-items: center; gap: 0.5rem;">
                    <i class="fa-brands fa-github"></i> GitHub
                </a>
                <a href="https://darun-portfolio.netlify.app/" target="_blank" rel="noopener noreferrer" class="btn btn-primary" aria-label="Developer Portfolio" style="display: inline-flex; align-items: center; gap: 0.5rem;">
                    <i class="fa-solid fa-globe"></i> Portfolio
                </a>
            </div>
        </div>

    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadGlobalLayout('contact');
        });

        async function handleContactSubmit(event) {
            event.preventDefault();
            
            const name = document.getElementById('contact-name').value;
            const email = document.getElementById('contact-email').value;
            const subject = document.getElementById('contact-subject').value;
            const message = document.getElementById('contact-message').value;
            const submitBtn = event.target.querySelector('button[type="submit"]');

            if (!name || !email || !subject || !message) {
                PlacementPrepState.dispatchToast('Please fill out all fields correctly.', 'warning');
                return;
            }

            const originalBtnText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending Message...';

            try {
                const response = await fetch('https://formsubmit.co/ajax/darunraj365@gmail.com', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        _subject: `[VetriPathLearn Feedback] ${subject.toUpperCase()} from ${name}`,
                        topic: subject,
                        message: message,
                        _template: 'table',
                        _captcha: 'false'
                    })
                });

                const data = await response.json();

                if (response.ok && data.success === 'true') {
                    PlacementPrepState.dispatchToast('✉️ Message sent successfully! Thank you.', 'success');
                    document.getElementById('contact-form').reset();
                } else if (data.message && data.message.includes('Activate')) {
                    PlacementPrepState.dispatchToast('⚠️ Setup note: FormSubmit activation email pending in recipient inbox.', 'warning');
                    const mailtoUrl = `mailto:darunraj365@gmail.com?subject=${encodeURIComponent('[VetriPathLearn Feedback] ' + subject)}&body=${encodeURIComponent('Name: ' + name + '\nEmail: ' + email + '\n\nMessage:\n' + message)}`;
                    window.location.href = mailtoUrl;
                } else {
                    const mailtoUrl = `mailto:darunraj365@gmail.com?subject=${encodeURIComponent('[VetriPathLearn Feedback] ' + subject)}&body=${encodeURIComponent('Name: ' + name + '\nEmail: ' + email + '\n\nMessage:\n' + message)}`;
                    window.location.href = mailtoUrl;
                    PlacementPrepState.dispatchToast('Opening Email app to send feedback...', 'info');
                }
            } catch (error) {
                const mailtoUrl = `mailto:darunraj365@gmail.com?subject=${encodeURIComponent('[VetriPathLearn Feedback] ' + subject)}&body=${encodeURIComponent('Name: ' + name + '\nEmail: ' + email + '\n\nMessage:\n' + message)}`;
                window.location.href = mailtoUrl;
                PlacementPrepState.dispatchToast('Opening Email app to send feedback...', 'info');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnText;
            }
        }
    </script>
    <script src="js/cheating_protection.js"></script>
</body>
